apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${LIB_PVC_NAME}
spec:
  storageClassName: "${STORAGE_CLASS}"
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: ${LIB_STORAGE_SIZE}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${CLIENT_PVC_NAME}
spec:
  storageClassName: "${STORAGE_CLASS}"
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: ${CLIENT_STORAGE_SIZE}
