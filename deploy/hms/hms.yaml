apiVersion: apps/v1
kind: Deployment
metadata:
  name: hms
  labels:
    app: hms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hms
  template:
    metadata:
      labels:
        app: hms
    spec:
      containers:
        - name: hms
          image: debian:${DEBIAN_IMAGE_VERSION}
          env:
            - name: JAVA_HOME
              value: ${CONTAINER_JAVA_HOME}
            - name: HADOOP_HOME
              value: ${CLIENT_DIR}/${HADOOP_CLIENT_DIR_NAME}
            - name: HIVE_HOME
              value: ${CLIENT_DIR}/${HIVE_CLIENT_DIR_NAME}
            - name: HIVE_CONF_DIR
              value: ${CLIENT_DIR}/${HIVE_CLIENT_DIR_NAME}/conf
          command:
            - ${CLIENT_DIR}/${HIVE_CLIENT_DIR_NAME}/bin/hive
            - --skiphadoopversion
            - --skiphbasecp
            - --service
            - metastore
          ports:
            - containerPort: 9083
          volumeMounts:
            - mountPath: ${CLIENT_DIR}
              name: client-pv
            - mountPath: ${CLIENT_DIR}/${HIVE_CLIENT_DIR_NAME}/lib/${POSTGRESQL_CONNECTOR_JAR_NAME}
              name: ${LIB_PV_NAME}
              subPath: ${POSTGRESQL_CONNECTOR_JAR_NAME}
            - mountPath: ${CLIENT_DIR}/${HIVE_CLIENT_DIR_NAME}/lib/${JUICEFS_HADOOP_JAR_NAME}
              name: ${LIB_PV_NAME}
              subPath: ${JUICEFS_HADOOP_JAR_NAME}
            - mountPath: ${CLIENT_DIR}/${HIVE_CLIENT_DIR_NAME}/conf/hive-site.xml
              name: hive-site-hms
              subPath: hive-site-hms.xml
            - mountPath: ${CLIENT_DIR}/${HIVE_CLIENT_DIR_NAME}/conf/core-site.xml
              name: core-site
              subPath: core-site.xml
            - mountPath: ${CLIENT_DIR}/${HIVE_CLIENT_DIR_NAME}/conf/hdfs-site.xml
              name: hdfs-site
              subPath: hdfs-site.xml
      volumes:
        - name: client-pv
          persistentVolumeClaim:
            claimName: ${CLIENT_PVC_NAME}
        - name: ${LIB_PV_NAME}
          persistentVolumeClaim:
            claimName: ${LIB_PVC_NAME}
        - name: core-site
          configMap:
            name: core-site
        - name: hive-site-hms
          configMap:
            name: hive-site-hms
        - name: hdfs-site
          configMap:
            name: hdfs-site
---
apiVersion: v1
kind: Service
metadata:
  name: hms
spec:
  type: NodePort
  selector:
    app: hms
  ports:
    - protocol: TCP
      port: 9083
      targetPort: 9083
      nodePort: ${HMS_PORT}
