---
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster
  namespace: ${NAMESPACE}
  labels:
    app: redis-cluster
spec:
  clusterIP: None
  selector:
    app: redis-cluster
  ports:
  - port: 6379
    name: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cluster
  namespace: ${NAMESPACE}
  labels:
    app: redis-cluster
spec:
  serviceName: redis-cluster
  replicas: ${REDIS_CLUSTER_NODES}
  selector:
    matchLabels:
      app: redis-cluster
  template:
    metadata:
      labels:
        app: redis-cluster
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      containers:
      - name: redis
        image: valkey/valkey:${VALKEY_VERSION}
        command:
        - /bin/sh
        - -c
        - |
          set -ex
          ORDINAL=${POD_NAME##*-}
          PORT=$((${BASE_PORT} + ORDINAL))
          BUS_PORT=$((PORT + 10000))
          echo "Starting Valkey cluster node ${ORDINAL} on port ${PORT} (bus ${BUS_PORT}), announcing ${ANNOUNCE_IP}:${PORT}"
          exec valkey-server \
            --cluster-enabled yes \
            --cluster-config-file nodes.conf \
            --cluster-node-timeout 5000 \
            --appendonly yes \
            --protected-mode no \
            --port ${PORT} \
            --cluster-announce-ip ${ANNOUNCE_IP} \
            --cluster-announce-port ${PORT} \
            --cluster-announce-bus-port ${BUS_PORT} \
            --dir /data
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: BASE_PORT
          value: "${REDIS_CLUSTER_BASE_PORT}"
        - name: ANNOUNCE_IP
          value: "${NODE_IP}"
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-cluster-init
  namespace: ${NAMESPACE}
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init
        image: valkey/valkey:${VALKEY_VERSION}
        command:
        - /bin/sh
        - -c
        - |
          set -ex
          echo "Waiting for all ${CLUSTER_NODES} Redis cluster nodes to be ready..."
          for i in $(seq 0 $((${CLUSTER_NODES} - 1))); do
            PORT=$((${BASE_PORT} + i))
            echo "Checking node ${ANNOUNCE_IP}:${PORT}..."
            until valkey-cli -h ${ANNOUNCE_IP} -p ${PORT} ping 2>/dev/null | grep -q PONG; do
              echo "  Waiting for ${ANNOUNCE_IP}:${PORT}..."
              sleep 2
            done
            echo "  Node ${ANNOUNCE_IP}:${PORT} is ready."
          done

          echo "All nodes are ready. Checking cluster state..."
          CLUSTER_INFO=$(valkey-cli -h ${ANNOUNCE_IP} -p ${BASE_PORT} cluster info 2>/dev/null || true)
          if echo "${CLUSTER_INFO}" | grep -q "cluster_state:ok"; then
            echo "Cluster is already healthy, skipping creation."
            exit 0
          fi

          echo "Creating cluster..."
          NODES=""
          for i in $(seq 0 $((${CLUSTER_NODES} - 1))); do
            PORT=$((${BASE_PORT} + i))
            NODES="${NODES} ${ANNOUNCE_IP}:${PORT}"
          done
          echo "Cluster nodes: ${NODES}"
          valkey-cli --cluster create ${NODES} --cluster-yes --cluster-replicas 0

          echo "Cluster created successfully. Cluster nodes:"
          valkey-cli -h ${ANNOUNCE_IP} -p ${BASE_PORT} cluster nodes
        env:
        - name: CLUSTER_NODES
          value: "${REDIS_CLUSTER_NODES}"
        - name: BASE_PORT
          value: "${REDIS_CLUSTER_BASE_PORT}"
        - name: ANNOUNCE_IP
          value: "${NODE_IP}"
