name: Release

# Only version tags can publish releases and images.
on:
  push:
    tags:
      - 'v*'

jobs:
  build-test-release:
    permissions:
      contents: read
    uses: ./.github/workflows/_build-java.yml
    with:
      release: true

  publish-images:
    needs: build-test-release
    # Version-series and latest tags are shared by releases. Keep complete
    # image publish runs in order so manifests cannot mix release versions.
    concurrency:
      group: sqlrec-image-publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    uses: ./.github/workflows/_build-images.yml
    with:
      build_target: all
      publish_images: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  publish-release:
    needs: [build-test-release, publish-images]
    runs-on: ubuntu-latest
    concurrency:
      group: sqlrec-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout sqlrec
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download shared wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: model-wheels-*
          path: ${{ runner.temp }}/release-input
          merge-multiple: false

      - name: Download release JARs
        uses: actions/download-artifact@v4
        with:
          name: release-jars
          path: ${{ runner.temp }}/release-input/release-jars

      - name: Validate and collect release assets
        run: |
          python3 .github/scripts/model_wheel_artifacts.py assemble \
            --artifacts-dir "$RUNNER_TEMP/release-input" \
            --output-dir "$RUNNER_TEMP/release-assets" --sqlrec-commit "$GITHUB_SHA"

      - name: Upload draft assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash .github/scripts/publish_release.sh "$RUNNER_TEMP/release-assets" "$RELEASE_TAG"
