name: Build, Test, Release and Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      juicefs_ref:
        description: 'juicefs fork ref (branch/tag/SHA)'
        required: false
        default: 'feat/sqlrec'
      tzrec_ref:
        description: 'TorchEasyRec fork ref (branch/tag/SHA)'
        required: false
        default: 'feat/sqlrec'

env:
  REGISTRY: docker.io

jobs:
  build-test-release:
    # Jar build + GitHub Release only make sense on tag pushes. Manual
    # workflow_dispatch runs skip this job and only build docker images.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cache sqlrec-ui frontend build artifacts: frontend-maven-plugin
      # downloads node/npm into sqlrec-ui/.node, and npm deps are installed
      # in src/main/frontend/node_modules. The key pins the node/npm versions -
      # if they are bumped in sqlrec-ui/pom.xml, update this key too so the
      # cache is invalidated.
      - name: Cache frontend node and npm deps
        uses: actions/cache@v4
        with:
          path: |
            sqlrec-ui/.node
            sqlrec-ui/src/main/frontend/node_modules
          key: frontend-${{ runner.os }}-node-v22.12.0-npm-10.2.4-${{ hashFiles('sqlrec-ui/src/main/frontend/package-lock.json') }}
          restore-keys: |
            frontend-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Fail early when the pushed tag (minus the v prefix) does not match
      # the root pom version, so a release never ships a jar named with a
      # stale version.
      - name: Verify tag matches pom version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          POM_VERSION="$(mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout)"
          echo "Tag version: ${TAG_VERSION}"
          echo "Pom version: ${POM_VERSION}"
          if [ "${TAG_VERSION}" != "${POM_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pom version ${POM_VERSION}. Bump the pom version before tagging."
            exit 1
          fi

      # The root pom's default profile configures surefire with
      # <excludedGroups>integration</excludedGroups>, so JUnit 5 tests
      # tagged with @Tag("integration") are skipped - only unit tests run.
      # -DexcludedGroups=integration is passed explicitly for safety.
      # A single `package` invocation runs the test phase (unit tests) before
      # building jars; splitting `test` and `package` into two runs would
      # execute sqlrec-ui's npm install + npm run build (bound to
      # generate-resources) twice.
      - name: Build and run unit tests
        run: mvn -B -DexcludedGroups=integration package

      - name: Upload jar to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Glob: matches the shaded jar for the current pom version
          # (sqlrec-flink-<version>.jar). The unshaded original is renamed to
          # original-sqlrec-flink-<version>.jar by the shade plugin and is
          # not matched by this glob.
          files: sqlrec-flink/target/sqlrec-flink-*.jar
          # Fail loudly if the jar is missing, instead of silently uploading
          # nothing.
          fail_on_unmatched_files: true

  # Docker jobs depend on build-test-release via `needs`: on tag pushes they
  # only run after the jar build/tests/release succeed; if that job fails or
  # is cancelled, these jobs are skipped. On manual workflow_dispatch runs
  # the release job is skipped (`if: github.event_name == 'push'` above), so
  # these jobs run directly. `always()` is required so this condition is
  # still evaluated when the needed job was skipped.
  docker-sqlrec:
    needs: build-test-release
    if: ${{ always() && (needs.build-test-release.result == 'success' || needs.build-test-release.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/sqlrec

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # type=ref/type=semver fire on `v*` tag pushes; type=sha covers
          # manual workflow_dispatch runs (which have no tag).
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # See the docker-sqlrec job for the `needs`/`if` dependency explanation.
  docker-gbdt:
    needs: build-test-release
    if: ${{ always() && (needs.build-test-release.result == 'success' || needs.build-test-release.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/gbdt

    steps:
      - name: Checkout sqlrec
        uses: actions/checkout@v4

      - name: Checkout juicefs fork
        uses: actions/checkout@v4
        with:
          repository: sqlrec/juicefs
          ref: ${{ inputs.juicefs_ref || 'feat/sqlrec' }}
          path: juicefs-src
          fetch-depth: 1

      # Build the juicefs Python wheel from the fork using its own Makefile
      # (sdk/python/Makefile): `make builder` creates the centos7 sdkbuilder
      # image, `make juicefs` builds libjfs.so + the wheel inside it. The
      # resulting wheel has a timestamped version (e.g. 1.3.0.<YYYYMMDDHHMM>),
      # so the Dockerfile consumes it via a `juicefs-*.whl` wildcard.
      - name: Build juicefs Python wheel
        working-directory: juicefs-src/sdk/python
        run: |
          make builder
          make juicefs
          find juicefs/dist -name 'juicefs-*.whl' -exec cp {} "$GITHUB_WORKSPACE/" \;
          ls -la "$GITHUB_WORKSPACE/"juicefs-*.whl

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # semver tags fire on `v*` tag pushes; `type=sha` covers manual
          # workflow_dispatch runs (which have no semver tag).
          tags: |
            type=semver,pattern={{version}}-cpu
            type=semver,pattern={{major}}.{{minor}}-cpu
            type=sha,format=short

      - name: Build and push GBDT image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/sqlrec-model-gbdt.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # See the docker-sqlrec job for the `needs`/`if` dependency explanation.
  docker-tzrec:
    needs: build-test-release
    if: ${{ always() && (needs.build-test-release.result == 'success' || needs.build-test-release.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/tzrec

    steps:
      - name: Checkout sqlrec
        uses: actions/checkout@v4

      - name: Checkout juicefs fork
        uses: actions/checkout@v4
        with:
          repository: sqlrec/juicefs
          ref: ${{ inputs.juicefs_ref || 'feat/sqlrec' }}
          path: juicefs-src
          fetch-depth: 1

      - name: Checkout TorchEasyRec fork
        uses: actions/checkout@v4
        with:
          repository: sqlrec/TorchEasyRec
          ref: ${{ inputs.tzrec_ref || 'feat/sqlrec' }}
          path: tzrec-src
          fetch-depth: 1

      # Build the juicefs Python wheel from the fork using its own Makefile
      # (sdk/python/Makefile): `make builder` creates the centos7 sdkbuilder
      # image, `make juicefs` builds libjfs.so + the wheel inside it. The
      # resulting wheel has a timestamped version (e.g. 1.3.0.<YYYYMMDDHHMM>),
      # so the Dockerfile consumes it via a `juicefs-*.whl` wildcard.
      - name: Build juicefs Python wheel
        working-directory: juicefs-src/sdk/python
        run: |
          make builder
          make juicefs
          find juicefs/dist -name 'juicefs-*.whl' -exec cp {} "$GITHUB_WORKSPACE/" \;
          ls -la "$GITHUB_WORKSPACE/"juicefs-*.whl

      # Build the tzrec Python wheel from the fork. setup.py only imports
      # codecs/os/setuptools (no torch at build time); install_requires is
      # metadata-only. gen_proto.sh generates tzrec/protos/*_pb2.py (which are
      # .py modules in a real package, so they are always packaged despite being
      # gitignored). The resulting wheel is
      # tzrec-<version>-py2.py3-none-any.whl (setup.cfg sets universal=1),
      # consumed via a `tzrec-*.whl` wildcard and installed with --no-deps
      # because the tzrec-devel base image already provides all runtime deps.
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build tzrec Python wheel
        working-directory: tzrec-src
        run: |
          pip install -U "grpcio-tools<1.63.0" setuptools wheel
          bash scripts/gen_proto.sh
          python setup.py sdist bdist_wheel
          cp dist/tzrec-*.whl "$GITHUB_WORKSPACE/"
          ls -la "$GITHUB_WORKSPACE/"tzrec-*.whl

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # semver tags fire on `v*` tag pushes; `type=sha` covers manual
          # workflow_dispatch runs (which have no semver tag).
          tags: |
            type=semver,pattern={{version}}-cpu
            type=semver,pattern={{major}}.{{minor}}-cpu
            type=sha,format=short

      - name: Build and push TZRec image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/sqlrec-model-tzrec.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
