name: Build and Push GBDT Model Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      juicefs_ref:
        description: 'juicefs fork ref (branch/tag/SHA)'
        required: false
        default: 'feat/sqlrec'

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/sqlrec-gbdt

jobs:
  # Build per-architecture images on native runners. The juicefs wheel embeds a
  # arch-specific libjfs.so, so it must be built on the same arch as the image
  # that consumes it — QEMU cross-build is not viable here. Each arch job pushes
  # to a per-arch tag (<tag>-amd64 / <tag>-arm64); the manifest job below merges
  # them into the unified multi-arch tag.
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            juicefs_builder: builder       # centos7 sdkbuilder (Dockerfile.builder)
          - arch: arm64
            runner: ubuntu-24.04-arm
            juicefs_builder: arm-builder   # golang:1.24 sdkbuilder (Dockerfile.builder.arm)
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout sqlrec
        uses: actions/checkout@v4

      - name: Checkout juicefs fork
        uses: actions/checkout@v4
        with:
          repository: sqlrec/juicefs
          ref: ${{ github.event.inputs.juicefs_ref || 'feat/sqlrec' }}
          path: juicefs-src
          fetch-depth: 1

      # Build the juicefs Python wheel from the fork using its own Makefile
      # (sdk/python/Makefile): `make <builder>` creates the sdkbuilder image for
      # the current arch, `make juicefs` builds libjfs.so + the wheel inside it.
      # The resulting wheel has a timestamped version (e.g. 1.3.0.<YYYYMMDDHHMM>),
      # so the Dockerfile consumes it via a `juicefs-*.whl` wildcard.
      - name: Build juicefs Python wheel
        working-directory: juicefs-src/sdk/python
        run: |
          make ${{ matrix.juicefs_builder }}
          make juicefs
          find juicefs/dist -name 'juicefs-*.whl' -exec cp {} "$GITHUB_WORKSPACE/" \;
          ls -la "$GITHUB_WORKSPACE/"juicefs-*.whl

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Per-arch tag: appends -<arch> to every generated tag (e.g. 1.2.3-cpu-amd64,
      # sha-abc1234-arm64). These are intermediate tags consumed by the manifest
      # job; the unified multi-arch tag is created there.
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-${{ matrix.arch }}
          # semver tags fire on `v*` tag pushes; `type=sha` covers manual
          # workflow_dispatch runs (which have no semver tag).
          tags: |
            type=semver,pattern={{version}}-cpu
            type=semver,pattern={{major}}.{{minor}}-cpu
            type=sha,format=short

      - name: Build and push GBDT image (${{ matrix.arch }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/sqlrec-model-gbdt.Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # provenance disabled so buildx pushes a plain single-platform image
          # digest that `buildx imagetools create` can merge cleanly below.
          provenance: false
          # Per-arch cache scope to avoid amd64/arm64 cache collisions.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

  # Merge the per-arch images into a single multi-arch manifest list under the
  # unified tag (no -<arch> suffix). Runs only after both arch builds succeed.
  manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `buildx imagetools` is a buildx CLI subcommand; ensure buildx is
      # available in this standalone job (no buildx setup is inherited from
      # the per-arch jobs since this is a separate runner).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Regenerate the same tag set WITHOUT the -<arch> suffix to get the
      # unified tags (1.2.3-cpu, 1.2-cpu, sha-abc1234).
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}-cpu
            type=semver,pattern={{major}}.{{minor}}-cpu
            type=sha,format=short

      - name: Create multi-arch manifest
        run: |
          set -e
          for tag in $(echo "${{ steps.meta.outputs.tags }}"); do
            echo "Merging $tag-amd64 + $tag-arm64 -> $tag"
            docker buildx imagetools create -t "$tag" "$tag-amd64" "$tag-arm64"
          done
