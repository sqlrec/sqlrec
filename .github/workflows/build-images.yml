name: Build and Test (No Publish)

run-name: Preflight ${{ inputs.build_target }} without publishing

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Java package/tests or images and wheels to build'
        required: true
        default: 'models'
        type: choice
        options:
          - java
          - models
          - juicefs
          - gbdt
          - tzrec
          - transformers
      juicefs_ref:
        description: 'juicefs fork ref (branch/tag/SHA)'
        required: false
        default: 'feat/sqlrec'
        type: string
      tzrec_ref:
        description: 'TorchEasyRec fork ref (branch/tag/SHA)'
        required: false
        default: 'feat/sqlrec'
        type: string
      arm_compat_ref:
        description: 'sqlrec-arm-compat branch'
        required: false
        default: 'master'
        type: string

# This caller deliberately has no write permission and passes no publishing
# secrets to the reusable workflow.
permissions:
  contents: read

jobs:
  build-test-java:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache frontend node and npm deps
        uses: actions/cache@v4
        with:
          path: |
            sqlrec-ui/.node
            sqlrec-ui/src/main/frontend/node_modules
          key: frontend-${{ runner.os }}-node-v22.12.0-npm-10.2.4-${{ hashFiles('sqlrec-ui/src/main/frontend/package-lock.json') }}
          restore-keys: |
            frontend-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Build and run unit tests
        run: mvn -B -DexcludedGroups=integration package

  build-images:
    needs: build-test-java
    if: ${{ inputs.build_target != 'java' }}
    uses: ./.github/workflows/_build-images.yml
    with:
      build_target: ${{ inputs.build_target }}
      publish_images: false
      juicefs_ref: ${{ inputs.juicefs_ref }}
      tzrec_ref: ${{ inputs.tzrec_ref }}
      arm_compat_ref: ${{ inputs.arm_compat_ref }}
