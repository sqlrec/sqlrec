name: Reusable Image Build

on:
  workflow_call:
    inputs:
      build_target:
        description: 'images to build'
        required: true
        type: string
      publish_images:
        description: 'whether to push images and create manifests'
        required: true
        type: boolean
      juicefs_ref:
        description: 'juicefs fork ref (branch/tag/SHA)'
        required: false
        default: 'feat/sqlrec'
        type: string
      tzrec_ref:
        description: 'TorchEasyRec fork ref (branch/tag/SHA)'
        required: false
        default: 'feat/sqlrec'
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

env:
  REGISTRY: docker.io

jobs:
  # This is the only implementation of image builds. The manual caller fixes
  # publish_images=false and passes no secrets; the tag-only release caller is
  # the sole workflow allowed to enable publishing.
  docker-sqlrec:
    if: ${{ inputs.build_target == 'sqlrec' || inputs.build_target == 'all' }}
    runs-on: ubuntu-latest
    outputs:
      image-version: ${{ steps.meta.outputs.version }}
    permissions:
      contents: read
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'sqlrec-build' }}/sqlrec

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: inputs.publish_images
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # type=ref/type=semver fire when called by a `v*` tag release;
          # type=sha supplies a local-only name for the manual build caller.
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish_images }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build after docker-sqlrec so the exact base-image tag referenced by the
  # demo Dockerfile is already available as a multi-architecture manifest.
  docker-demo:
    needs: docker-sqlrec
    # The demo consumes the sqlrec image by registry tag, so it only makes
    # sense when the selected run publishes that base image.
    if: ${{ inputs.publish_images }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'sqlrec-build' }}/sqlrec-demo
      BASE_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'sqlrec-build' }}/sqlrec

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push Demo image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/demo.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SQLREC_IMAGE=${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}
            SQLREC_VERSION=${{ needs.docker-sqlrec.outputs.image-version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sqlrec-demo
          cache-to: type=gha,mode=max,scope=sqlrec-demo

  # See the docker-sqlrec job for the `needs`/`if` dependency explanation.
  docker-gbdt:
    name: Build GBDT / JuiceFS (${{ matrix.arch }})
    if: ${{ inputs.build_target == 'models' || inputs.build_target == 'juicefs' || inputs.build_target == 'gbdt' || inputs.build_target == 'all' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            juicefs_builder: builder
          - arch: arm64
            runner: ubuntu-24.04-arm
            juicefs_builder: arm-builder
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'sqlrec-build' }}/gbdt

    steps:
      - name: Checkout sqlrec
        uses: actions/checkout@v4

      - name: Checkout juicefs fork
        uses: actions/checkout@v4
        with:
          repository: sqlrec/juicefs
          ref: ${{ inputs.juicefs_ref || 'feat/sqlrec' }}
          path: juicefs-src
          fetch-depth: 1

      # The wheel embeds libjfs.so, so each image must consume a wheel built on
      # the same native architecture. QEMU is intentionally not used here.
      - name: Build juicefs Python wheel
        working-directory: juicefs-src/sdk/python
        run: |
          make ${{ matrix.juicefs_builder }}
          # Derive the CI builder without changing the checked-out JuiceFS
          # Makefile or Dockerfiles. docker run inherits GOFLAGS from the
          # image, disabling Go VCS stamping for the bind-mounted checkout.
          docker tag sdkbuilder sdkbuilder-base
          docker build --tag sdkbuilder - <<'EOF'
          FROM sdkbuilder-base
          ENV GOFLAGS=-buildvcs=false
          EOF
          build_date="$(TZ=UTC git show -s --date=format-local:'%Y-%m-%dT%H:%M:%SZ' --format=%cd)"
          build_date_short="$(TZ=UTC git show -s --date=format-local:'%Y%m%d%H%M' --format=%cd)"
          make juicefs BUILD_DATE="$build_date" BUILD_DATE_SHORT="$build_date_short"
          find juicefs/dist -name 'juicefs-*.whl' -exec cp {} "$GITHUB_WORKSPACE/" \;
          ls -la "$GITHUB_WORKSPACE/"juicefs-*.whl

      - name: Set up Docker Buildx
        if: inputs.build_target != 'juicefs'
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: inputs.publish_images && inputs.build_target != 'juicefs'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        if: inputs.build_target != 'juicefs'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # metadata-action adds `latest` for stable semver tags. Apply the
          # architecture suffix to it too, so the manifest job can consume
          # latest-amd64 and latest-arm64 just like the versioned tags.
          flavor: |
            latest=auto
            suffix=-${{ matrix.arch }},onlatest=true
          # Semver tags fire when called by a `v*` tag release; `type=sha`
          # supplies a local-only name for the manual build caller.
          tags: |
            type=semver,pattern={{version}}-cpu
            type=semver,pattern={{major}}.{{minor}}-cpu
            type=sha,format=short

      # Load the native single-platform image first so architecture and dynamic
      # library checks finish before any per-architecture tags are published.
      - name: Build GBDT image (${{ matrix.arch }})
        if: inputs.build_target != 'juicefs'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/sqlrec-model-gbdt.Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gbdt-${{ matrix.arch }}
          cache-to: type=gha,scope=gbdt-${{ matrix.arch }},mode=max

      - name: Verify GBDT image (${{ matrix.arch }})
        if: inputs.build_target != 'juicefs'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          image="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          actual_arch="$(docker run --rm --entrypoint uname "$image" -m)"
          case "$EXPECTED_ARCH:$actual_arch" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "unexpected image architecture: $actual_arch" >&2; exit 1 ;;
          esac
          docker run --rm --entrypoint python "$image" -c \
            'import catboost, fsspec, lightgbm, onnxruntime, pandas, pyarrow, xgboost'
          docker run --rm --entrypoint python "$image" -c \
            'import ctypes, pathlib, juicefs; ctypes.CDLL(str(pathlib.Path(juicefs.__file__).with_name("libjfs.so")))'
          docker run --rm --entrypoint sh "$image" -c \
            'set -eu; links="$(ldd /app/onnx_server /app/catboost_server 2>&1)"; printf "%s\n" "$links"; ! printf "%s\n" "$links" | grep -q "not found"'

      - name: Push GBDT image (${{ matrix.arch }})
        if: inputs.publish_images && inputs.build_target != 'juicefs'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker push "$tag"
            fi
          done <<EOF
          $IMAGE_TAGS
          EOF

  docker-gbdt-manifest:
    needs: docker-gbdt
    if: ${{ needs.docker-gbdt.result == 'success' && inputs.build_target != 'juicefs' && inputs.publish_images }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'sqlrec-build' }}/gbdt

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Keep this in sync with the per-architecture metadata above.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}-cpu
            type=semver,pattern={{major}}.{{minor}}-cpu
            type=sha,format=short

      - name: Create multi-architecture manifests
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker buildx imagetools create \
                --tag "$tag" \
                "$tag-amd64" \
                "$tag-arm64"
            fi
          done <<EOF
          $IMAGE_TAGS
          EOF

  # The amd64 variant includes CUDA, while arm64 uses the PyTorch CPU wheel.
  # Buildx publishes both variants as one multi-architecture image manifest.
  docker-transformers:
    if: ${{ inputs.build_target == 'models' || inputs.build_target == 'transformers' || inputs.build_target == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'sqlrec-build' }}/transformers

    steps:
      - name: Checkout sqlrec
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: inputs.publish_images
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build Transformers image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/sqlrec-model-transformers.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish_images }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=transformers
          cache-to: type=gha,mode=max,scope=transformers

  # See the docker-sqlrec job for the `needs`/`if` dependency explanation.
  docker-tzrec:
    if: ${{ inputs.build_target == 'models' || inputs.build_target == 'tzrec' || inputs.build_target == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'sqlrec-build' }}/tzrec

    steps:
      - name: Checkout sqlrec
        uses: actions/checkout@v4

      - name: Checkout juicefs fork
        uses: actions/checkout@v4
        with:
          repository: sqlrec/juicefs
          ref: ${{ inputs.juicefs_ref || 'feat/sqlrec' }}
          path: juicefs-src
          fetch-depth: 1

      - name: Checkout TorchEasyRec fork
        uses: actions/checkout@v4
        with:
          repository: sqlrec/TorchEasyRec
          ref: ${{ inputs.tzrec_ref || 'feat/sqlrec' }}
          path: tzrec-src
          fetch-depth: 1

      # Build the juicefs Python wheel from the fork using its own Makefile
      # (sdk/python/Makefile): `make builder` creates the centos7 sdkbuilder
      # image, `make juicefs` builds libjfs.so + the wheel inside it. The
      # resulting wheel has a timestamped version (e.g. 1.3.0.<YYYYMMDDHHMM>),
      # so the Dockerfile consumes it via a `juicefs-*.whl` wildcard.
      - name: Build juicefs Python wheel
        working-directory: juicefs-src/sdk/python
        run: |
          make builder
          # Keep the third-party checkout unchanged; make juicefs will use
          # this derived image and inherit GOFLAGS inside its container.
          docker tag sdkbuilder sdkbuilder-base
          docker build --tag sdkbuilder - <<'EOF'
          FROM sdkbuilder-base
          ENV GOFLAGS=-buildvcs=false
          EOF
          make juicefs
          find juicefs/dist -name 'juicefs-*.whl' -exec cp {} "$GITHUB_WORKSPACE/" \;
          ls -la "$GITHUB_WORKSPACE/"juicefs-*.whl

      # Build the tzrec Python wheel from the fork. setup.py only imports
      # codecs/os/setuptools (no torch at build time); install_requires is
      # metadata-only. gen_proto.sh generates tzrec/protos/*_pb2.py (which are
      # .py modules in a real package, so they are always packaged despite being
      # gitignored). The resulting wheel is
      # tzrec-<version>-py2.py3-none-any.whl (setup.cfg sets universal=1),
      # consumed via a `tzrec-*.whl` wildcard and installed with --no-deps
      # because the tzrec-devel base image already provides all runtime deps.
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build tzrec Python wheel
        working-directory: tzrec-src
        run: |
          pip install -U "grpcio-tools<1.63.0" setuptools wheel
          bash scripts/gen_proto.sh
          python setup.py sdist bdist_wheel
          cp dist/tzrec-*.whl "$GITHUB_WORKSPACE/"
          ls -la "$GITHUB_WORKSPACE/"tzrec-*.whl

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: inputs.publish_images
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Semver tags fire when called by a `v*` tag release; `type=sha`
          # supplies a local-only name for the manual build caller.
          tags: |
            type=semver,pattern={{version}}-cpu
            type=semver,pattern={{major}}.{{minor}}-cpu
            type=sha,format=short

      - name: Build TZRec image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/sqlrec-model-tzrec.Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.publish_images }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
