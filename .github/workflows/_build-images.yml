name: Reusable Image Build

on:
  workflow_call:
    inputs:
      build_target:
        description: 'images to build'
        required: true
        type: string
      publish_images:
        description: 'whether to push images and create manifests'
        required: true
        type: boolean
      juicefs_ref:
        description: 'juicefs fork ref (branch/tag/SHA)'
        required: false
        default: 'feat/sqlrec'
        type: string
      tzrec_ref:
        description: 'TorchEasyRec fork ref (branch/tag/SHA)'
        required: false
        default: 'feat/sqlrec'
        type: string
      arm_compat_ref:
        description: 'sqlrec-arm-compat branch (resolved once per run)'
        required: false
        default: 'master'
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

env:
  REGISTRY: docker.io

jobs:
  # This is the only implementation of image builds. The manual caller fixes
  # publish_images=false and passes no secrets; the tag-only release caller is
  # the sole workflow allowed to enable publishing.
  resolve-model-sources:
    if: ${{ inputs.build_target == 'models' || inputs.build_target == 'juicefs' || inputs.build_target == 'gbdt' || inputs.build_target == 'tzrec' || inputs.build_target == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      juicefs_commit: ${{ steps.revisions.outputs.juicefs_commit }}
      tzrec_commit: ${{ steps.revisions.outputs.tzrec_commit }}
      arm_compat_commit: ${{ steps.revisions.outputs.arm_compat_commit }}
    steps:
      - name: Checkout JuiceFS fork
        uses: actions/checkout@v4
        with:
          repository: sqlrec/juicefs
          ref: ${{ inputs.juicefs_ref || 'feat/sqlrec' }}
          path: submodules/juicefs-src
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout TorchEasyRec fork
        if: inputs.build_target == 'models' || inputs.build_target == 'tzrec' || inputs.build_target == 'all'
        uses: actions/checkout@v4
        with:
          repository: sqlrec/TorchEasyRec
          ref: ${{ inputs.tzrec_ref || 'feat/sqlrec' }}
          path: submodules/tzrec-src
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout sqlrec-arm-compat branch
        if: inputs.build_target == 'models' || inputs.build_target == 'tzrec' || inputs.build_target == 'all'
        uses: actions/checkout@v4
        with:
          repository: sqlrec/sqlrec-arm-compat
          ref: ${{ inputs.arm_compat_ref || 'master' }}
          path: submodules/compat-src
          fetch-depth: 1
          persist-credentials: false

      - name: Record source revisions for this run
        id: revisions
        env:
          BUILD_TARGET: ${{ inputs.build_target }}
        run: |
          echo "juicefs_commit=$(git -C submodules/juicefs-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$BUILD_TARGET" == models || "$BUILD_TARGET" == tzrec || "$BUILD_TARGET" == all ]]; then
            echo "tzrec_commit=$(git -C submodules/tzrec-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "arm_compat_commit=$(git -C submodules/compat-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  compat-x86-test:
    needs: resolve-model-sources
    if: ${{ inputs.build_target == 'models' || inputs.build_target == 'tzrec' || inputs.build_target == 'all' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout the resolved compatibility revision
        uses: actions/checkout@v4
        with:
          repository: sqlrec/sqlrec-arm-compat
          ref: ${{ needs.resolve-model-sources.outputs.arm_compat_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compare supported APIs with original x86 wheels
        run: |
          python -m venv "$RUNNER_TEMP/compat-python"
          python -m venv "$RUNNER_TEMP/original-python"
          "$RUNNER_TEMP/compat-python/bin/python" -m pip install \
            'numpy==1.26.4' 'pyarrow==17.0.0' 'pyfarmhash==0.4.0' 'pytest>=8,<10'
          "$RUNNER_TEMP/compat-python/bin/python" -m pip install --no-deps \
            -e ./packages/pyfg -e ./packages/graphlearn
          "$RUNNER_TEMP/original-python/bin/python" -m pip install \
            'numpy==1.26.4' 'pyarrow==17.0.0' \
            'https://tzrec.oss-accelerate.aliyuncs.com/third_party/pyfg-1.0.5-cp311-cp311-linux_x86_64.whl' \
            'https://tzrec.oss-accelerate.aliyuncs.com/third_party/graphlearn/graphlearn-1.3.8-cp311-cp311-linux_x86_64.whl'
          SQLREC_ORIGINAL_PYTHON="$RUNNER_TEMP/original-python/bin/python" \
            "$RUNNER_TEMP/compat-python/bin/python" -m pytest -q tests/test_differential.py

  docker-sqlrec:
    if: ${{ inputs.build_target == 'sqlrec' || inputs.build_target == 'all' }}
    runs-on: ubuntu-latest
    outputs:
      image-version: ${{ steps.meta.outputs.version }}
    permissions:
      contents: read
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'sqlrec-build' }}/sqlrec

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: inputs.publish_images
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # type=ref/type=semver fire when called by a `v*` tag release;
          # type=sha supplies a local-only name for the manual build caller.
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish_images }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build after docker-sqlrec so the exact base-image tag referenced by the
  # demo Dockerfile is already available as a multi-architecture manifest.
  docker-demo:
    needs: docker-sqlrec
    # The demo consumes the sqlrec image by registry tag, so it only makes
    # sense when the selected run publishes that base image.
    if: ${{ inputs.publish_images }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'sqlrec-build' }}/sqlrec-demo
      BASE_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'sqlrec-build' }}/sqlrec

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push Demo image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/demo.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SQLREC_IMAGE=${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}
            SQLREC_VERSION=${{ needs.docker-sqlrec.outputs.image-version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sqlrec-demo
          cache-to: type=gha,mode=max,scope=sqlrec-demo

  # See the docker-sqlrec job for the `needs`/`if` dependency explanation.
  docker-gbdt:
    name: Build GBDT / JuiceFS (${{ matrix.arch }})
    needs: resolve-model-sources
    if: ${{ inputs.build_target == 'models' || inputs.build_target == 'juicefs' || inputs.build_target == 'gbdt' || inputs.build_target == 'all' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'sqlrec-build' }}/gbdt

    steps:
      - name: Checkout sqlrec
        uses: actions/checkout@v4

      - name: Checkout juicefs fork
        uses: actions/checkout@v4
        with:
          repository: sqlrec/juicefs
          ref: ${{ needs.resolve-model-sources.outputs.juicefs_commit }}
          path: submodules/juicefs-src
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build a cp310 wheel on the native runner against Bookworm glibc, which
      # matches the Python 3.10 Bookworm GBDT runtime image.
      - name: Build JuiceFS Python 3.10 wheel
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} \
            --file "$GITHUB_WORKSPACE/docker/model-wheel-juicefs.Dockerfile" \
            --build-arg PYTHON_VERSION=3.10 --target wheels \
            --output "type=local,dest=$RUNNER_TEMP/juicefs-wheel" \
            ./submodules/juicefs-src
          cp "$RUNNER_TEMP/juicefs-wheel"/juicefs-*-cp310-cp310-linux_*.whl ./
          ls -lh juicefs-*.whl

      - name: Login to DockerHub
        if: inputs.publish_images && inputs.build_target != 'juicefs'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        if: inputs.build_target != 'juicefs'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # metadata-action adds `latest` for stable semver tags. Apply the
          # architecture suffix to it too, so the manifest job can consume
          # latest-amd64 and latest-arm64 just like the versioned tags.
          flavor: |
            latest=auto
            suffix=-${{ matrix.arch }},onlatest=true
          # Semver tags fire when called by a `v*` tag release; `type=sha`
          # supplies a local-only name for the manual build caller.
          tags: |
            type=semver,pattern={{version}}-cpu
            type=semver,pattern={{major}}.{{minor}}-cpu
            type=sha,format=short

      # Load the native single-platform image first so architecture and dynamic
      # library checks finish before any per-architecture tags are published.
      - name: Build GBDT image (${{ matrix.arch }})
        if: inputs.build_target != 'juicefs'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/sqlrec-model-gbdt.Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gbdt-${{ matrix.arch }}
          cache-to: type=gha,scope=gbdt-${{ matrix.arch }},mode=max

      - name: Verify GBDT image (${{ matrix.arch }})
        if: inputs.build_target != 'juicefs'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          image="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          actual_arch="$(docker run --rm --entrypoint uname "$image" -m)"
          case "$EXPECTED_ARCH:$actual_arch" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "unexpected image architecture: $actual_arch" >&2; exit 1 ;;
          esac
          docker run --rm --entrypoint python "$image" -c \
            'import catboost, fsspec, gbdt, lightgbm, onnxruntime, pandas, pyarrow, xgboost'
          docker run --rm --entrypoint python "$image" -c \
            'import ctypes, pathlib, juicefs; ctypes.CDLL(str(pathlib.Path(juicefs.__file__).with_name("libjfs.so")))'
          docker run --rm --entrypoint sh "$image" -c \
            'set -eu; links="$(ldd /app/onnx_server /app/catboost_server 2>&1)"; printf "%s\n" "$links"; ! printf "%s\n" "$links" | grep -q "not found"'

      - name: Push GBDT image (${{ matrix.arch }})
        if: inputs.publish_images && inputs.build_target != 'juicefs'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker push "$tag"
            fi
          done <<EOF
          $IMAGE_TAGS
          EOF

  docker-gbdt-manifest:
    needs: docker-gbdt
    if: ${{ needs.docker-gbdt.result == 'success' && inputs.build_target != 'juicefs' && inputs.publish_images }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'sqlrec-build' }}/gbdt

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Keep this in sync with the per-architecture metadata above.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}-cpu
            type=semver,pattern={{major}}.{{minor}}-cpu
            type=sha,format=short

      - name: Create multi-architecture manifests
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker buildx imagetools create \
                --tag "$tag" \
                "$tag-amd64" \
                "$tag-arm64"
            fi
          done <<EOF
          $IMAGE_TAGS
          EOF

  # The amd64 variant includes CUDA, while arm64 uses the PyTorch CPU wheel.
  # Buildx publishes both variants as one multi-architecture image manifest.
  docker-transformers:
    if: ${{ inputs.build_target == 'models' || inputs.build_target == 'transformers' || inputs.build_target == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'sqlrec-build' }}/transformers

    steps:
      - name: Checkout sqlrec
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: inputs.publish_images
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build Transformers image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/sqlrec-model-transformers.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish_images }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=transformers
          cache-to: type=gha,mode=max,scope=transformers

  # See the docker-sqlrec job for the `needs`/`if` dependency explanation.
  docker-tzrec:
    name: Build TZRec / JuiceFS (${{ matrix.arch }})
    needs: [resolve-model-sources, compat-x86-test]
    if: ${{ needs.compat-x86-test.result == 'success' && (inputs.build_target == 'models' || inputs.build_target == 'tzrec' || inputs.build_target == 'all') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'sqlrec-build' }}/tzrec

    steps:
      - name: Checkout sqlrec
        uses: actions/checkout@v4

      - name: Checkout juicefs fork
        uses: actions/checkout@v4
        with:
          repository: sqlrec/juicefs
          ref: ${{ needs.resolve-model-sources.outputs.juicefs_commit }}
          path: submodules/juicefs-src
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout TorchEasyRec fork
        uses: actions/checkout@v4
        with:
          repository: sqlrec/TorchEasyRec
          ref: ${{ needs.resolve-model-sources.outputs.tzrec_commit }}
          path: submodules/tzrec-src
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout the resolved compatibility revision
        if: matrix.arch == 'arm64'
        uses: actions/checkout@v4
        with:
          repository: sqlrec/sqlrec-arm-compat
          ref: ${{ needs.resolve-model-sources.outputs.arm_compat_commit }}
          path: submodules/compat-src
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # TZRec uses Python 3.11 on both architectures. Keep its JuiceFS wheel
      # specific to that interpreter and the native runner architecture.
      - name: Build JuiceFS Python 3.11 wheel
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} \
            --file "$GITHUB_WORKSPACE/docker/model-wheel-juicefs.Dockerfile" \
            --build-arg PYTHON_VERSION=3.11 --target wheels \
            --output "type=local,dest=$RUNNER_TEMP/juicefs-wheel" \
            ./submodules/juicefs-src
          cp "$RUNNER_TEMP/juicefs-wheel"/juicefs-*-cp311-cp311-linux_*.whl ./
          ls -lh juicefs-*.whl

      - name: Build tzrec Python wheel
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} \
            --file "$GITHUB_WORKSPACE/docker/model-wheel-tzrec.Dockerfile" \
            --target wheels \
            --output "type=local,dest=$RUNNER_TEMP/tzrec-wheel" \
            ./submodules/tzrec-src
          cp "$RUNNER_TEMP/tzrec-wheel"/tzrec-*-none-any.whl ./
          ls -lh tzrec-*.whl

      - name: Test ARM compatibility APIs
        if: matrix.arch == 'arm64'
        run: |
          docker buildx build --platform linux/arm64 --target test --load \
            --tag sqlrec-arm-compat:test ./submodules/compat-src
          docker run --rm sqlrec-arm-compat:test

      - name: Build ARM compatibility wheels
        if: matrix.arch == 'arm64'
        run: |
          docker buildx build --platform linux/arm64 --target wheels \
            --output "type=local,dest=$RUNNER_TEMP/compat-wheels" ./submodules/compat-src
          cp "$RUNNER_TEMP/compat-wheels"/pyfarmhash-*.whl ./
          cp "$RUNNER_TEMP/compat-wheels"/pyfg-*.whl ./
          cp "$RUNNER_TEMP/compat-wheels"/graphlearn-*.whl ./
          ls -la pyfarmhash-*.whl pyfg-*.whl graphlearn-*.whl

      - name: Login to DockerHub
        if: inputs.publish_images
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
            suffix=-${{ matrix.arch }},onlatest=true
          # Semver tags fire when called by a `v*` tag release; `type=sha`
          # supplies a local-only name for the manual build caller.
          tags: |
            type=semver,pattern={{version}}-cpu
            type=semver,pattern={{major}}.{{minor}}-cpu
            type=sha,format=short

      - name: Build TZRec image (${{ matrix.arch }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/sqlrec-model-tzrec.Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=tzrec-${{ matrix.arch }}
          cache-to: type=gha,scope=tzrec-${{ matrix.arch }},mode=max

      - name: Verify TZRec image (${{ matrix.arch }})
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          image="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          actual_arch="$(docker run --rm --entrypoint uname "$image" -m)"
          case "$EXPECTED_ARCH:$actual_arch" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "unexpected image architecture: $actual_arch" >&2; exit 1 ;;
          esac
          docker run --rm --entrypoint python "$image" -c \
            'import flask, graphlearn, juicefs, pyarrow, pyfg, server, torch, torchrec, tzrec.main'
          docker run --rm --entrypoint python "$image" -c \
            'import ctypes, pathlib, juicefs; ctypes.CDLL(str(pathlib.Path(juicefs.__file__).with_name("libjfs.so")))'
          docker run --rm -i -e USE_FARM_HASH_TO_BUCKETIZE=true \
            --entrypoint python "$image" - <<'PY'
          import pyarrow as pa
          import pyfg
          from tzrec.datasets.data_parser import DataParser
          from tzrec.features.id_feature import IdFeature
          from tzrec.protos import feature_pb2

          pyfg.set_env("USE_FARM_HASH_TO_BUCKETIZE", "true")
          specs = (
              ("age", "num_buckets", [1, None, 3], [1, 3]),
              ("city", "hash_bucket_size", ["abc", None, "hij"], [85, 95]),
          )
          features = []
          data = {"label": pa.array([1, 0, 1])}
          for name, bucket, values, _ in specs:
              config = feature_pb2.FeatureConfig(
                  id_feature=feature_pb2.IdFeature(
                      feature_name=name,
                      expression=f"item:{name}",
                      embedding_dim=16,
                      **{bucket: 100},
                  )
              )
              features.append(IdFeature(config, fg_mode=2))
              data[name] = pa.array(values)
          parsed = DataParser(features, labels=["label"]).parse(data)
          for name, _, _, expected in specs:
              assert parsed[f"{name}.values"].tolist() == expected
              assert parsed[f"{name}.lengths"].tolist() == [1, 0, 1]
          assert parsed["label"].tolist() == [1, 0, 1]
          PY

      - name: Push TZRec image (${{ matrix.arch }})
        if: inputs.publish_images
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker push "$tag"
            fi
          done <<EOF
          $IMAGE_TAGS
          EOF

  docker-tzrec-manifest:
    needs: docker-tzrec
    if: ${{ needs.docker-tzrec.result == 'success' && inputs.publish_images }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'sqlrec-build' }}/tzrec

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}-cpu
            type=semver,pattern={{major}}.{{minor}}-cpu
            type=sha,format=short

      - name: Create multi-architecture manifests
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker buildx imagetools create \
                --tag "$tag" \
                "$tag-amd64" \
                "$tag-arm64"
            fi
          done <<EOF
          $IMAGE_TAGS
          EOF
