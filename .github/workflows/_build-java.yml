name: Reusable Java Build

on:
  workflow_call:
    inputs:
      unit_tests_only:
        description: 'Run Java unit tests without Python tests or packaging'
        type: boolean
        default: false
      release:
        description: 'Verify the release tag and save release JARs'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keep Node/npm versions in sync with sqlrec-ui/pom.xml.
      - name: Cache frontend node and npm deps
        uses: actions/cache@v4
        with:
          path: |
            sqlrec-ui/.node
            sqlrec-ui/src/main/frontend/node_modules
          key: frontend-${{ runner.os }}-node-v22.12.0-npm-10.2.4-${{ hashFiles('sqlrec-ui/src/main/frontend/package-lock.json') }}
          restore-keys: |
            frontend-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python 3.11
        if: ${{ !inputs.unit_tests_only }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Test artifact and release helpers
        if: ${{ !inputs.unit_tests_only }}
        run: python3 -m unittest discover -s .github/tests -v

      - name: Verify tag matches pom version
        if: inputs.release
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          POM_VERSION="$(mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout)"
          echo "Tag version: ${TAG_VERSION}"
          echo "Pom version: ${POM_VERSION}"
          if [ "${TAG_VERSION}" != "${POM_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pom version ${POM_VERSION}. Bump the pom version before tagging."
            exit 1
          fi

      - name: Build and run unit tests
        if: ${{ !inputs.unit_tests_only }}
        run: mvn -B -DexcludedGroups=integration package

      # UI resources are required by UiHandlerTest, so keep the frontend build.
      # Skip only Python tests; -DskipTests would also disable the Java tests.
      - name: Run Java unit tests
        if: inputs.unit_tests_only
        run: mvn -B -ntp -DskipPythonTests=true -DexcludedGroups=integration test

      - name: Save Java test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore
          retention-days: 7

      - name: Save release JARs
        if: inputs.release
        uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: |
            sqlrec-flink/target/sqlrec-flink-*.jar
            sqlrec-frontend/target/sqlrec-frontend-*.jar
          if-no-files-found: error
          overwrite: true
          retention-days: 14
          compression-level: 0
